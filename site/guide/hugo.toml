baseURL = 'https://unset-sh.github.io/brand/'
locale = 'en'
title = 'Brand guide · unset.sh'
disableKinds = ['taxonomy', 'term', 'RSS', 'sitemap']
enableRobotsTXT = true

[module]
  [module.hugoVersion]
    min = '0.168.0'
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = '../../dist'
    target = 'static/assets/brand'
  [[module.mounts]]
    source = '../../dist'
    target = 'data/brand'
    files = ['contract.json', 'meta.json']
  [[module.mounts]]
    source = '../../fonts'
    target = 'static/assets/fonts'
  [[module.mounts]]
    source = '../../logo'
    target = 'static/assets/logo'
  [[module.mounts]]
    source = '../../icons'
    target = 'static/assets/icons'
