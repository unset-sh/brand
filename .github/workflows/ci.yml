name: ci

# Calls tooling's shared check, the single source of truth for how organisation repositories run CI.
# Pinned to a full tooling commit; docs/use-workflows.md in unset-sh/tooling describes the inputs.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [staging, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The repository ruleset requires this status; through the shared workflow it reads
    # "Check pins, tokens, files and package / Check".
    name: Check pins, tokens, files and package
    uses: unset-sh/tooling/.github/workflows/ci-check.yml@cbc0732281b48db638da554fe163d156e64f9066
    permissions:
      contents: read
      packages: read # the shared install step may read @unset-sh packages; brand has none today
    with:
      install: true
      timeout-minutes: 15
      # The guide is built at the site root and at the project Pages path, with Hugo verified by its digest.
      command: |
        bun run check
        bash .github/install-hugo.sh
        export HUGO_BINARY="$RUNNER_TEMP/brand-hugo/hugo"
        bun run site:build
        BRAND_BASE_PATH=/brand/ BRAND_BASE_URL=https://unset-sh.github.io/brand/ bun run site:build
