name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [staging, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Keep this status name stable: the repository ruleset requires it.
    name: Check pins, tokens, files and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Install verified Hugo
        run: bash .github/install-hugo.sh
      - name: Build at site root
        run: bun run site:build
      - name: Build at a project Pages path
        env:
          BRAND_BASE_PATH: /brand/
          BRAND_BASE_URL: https://unset-sh.github.io/brand/
        run: bun run site:build
