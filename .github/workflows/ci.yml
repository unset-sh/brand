name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Keep this status name stable: the repository ruleset requires it.
    name: Check pins, tokens, files and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Install verified Hugo
        run: bash .github/install-hugo.sh
      - name: Build at site root
        run: npm run site:build
      - name: Build at a project Pages path
        env:
          BRAND_BASE_PATH: /brand/
          BRAND_BASE_URL: https://unset-sh.github.io/brand/
        run: npm run site:build
